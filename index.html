<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="학교 설문">
<title>GH 학교 설문조사</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --blue: #1a73e8;
    --blue-soft: #e8f0fe;
    --ink: #191f28;
    --sub: #6b7684;
    --line: #e5e8eb;
    --bg: #f2f4f6;
    --card: #ffffff;
    --red: #e5484d;
    --green: #12a150;
    --radius: 16px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* 상단바 */
  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
    background: rgba(255,255,255,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .top-in { max-width: 720px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; margin-right: auto; white-space: nowrap; }
  @media (max-width: 440px) {
    .top-in { gap: 6px; padding: 10px 12px; }
    .brand-text { display: none; }
    .pill { padding: 6px 10px; font-size: 13px; }
  }
  .brand b { background: var(--blue); color: #fff; border-radius: 8px; padding: 2px 7px; font-size: 14px; }
  .pill {
    border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 12px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .pill.blue { color: var(--blue); border-color: #c6dafc; }

  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 120px; }
  h1 { font-size: 26px; line-height: 1.3; margin: 8px 0 6px; letter-spacing: -0.02em; }
  h2 { font-size: 19px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--sub); margin: 0 0 20px; }

  /* 공통 부품 */
  .box { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-size: 14px; font-weight: 600; color: var(--sub); margin-bottom: 6px; }
  .input, .field input, .field select, .field textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 12px; background: #fff;
    padding: 13px 14px; font-size: 16px; outline: none;
  }
  .input:focus, .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--blue); }
  textarea { resize: vertical; min-height: 90px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 0; border-radius: 12px; padding: 14px 18px; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  .btn.full { width: 100%; }
  .btn.primary { background: var(--blue); color: #fff; }
  .btn.primary:disabled { background: #a8c7fa; cursor: default; }
  .btn.soft { background: var(--blue-soft); color: var(--blue); }
  .btn.ghost { background: transparent; color: var(--sub); }
  .btn.google { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
  .btn.google:disabled { color: var(--sub); }
  .btn.danger { background: #fdecec; color: var(--red); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .row > .btn { flex: 1; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; margin: 4px 0 16px; cursor: pointer; }
  .check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--blue); flex: none; }

  /* 버튼형 선택 (학년·성별 등) */
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg label { flex: 1; min-width: 64px; cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span {
    display: block; text-align: center; padding: 12px 8px; border-radius: 12px;
    border: 1.5px solid var(--line); background: #fff; font-weight: 600;
  }
  .seg input:checked + span { border-color: var(--blue); background: var(--blue-soft); color: var(--blue); }
  .seg input:focus-visible + span { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* 로그인 */
  .auth { max-width: 420px; margin: 24px auto 0; }
  .auth h1 { font-size: 28px; }
  .demo {
    margin-top: 18px; padding: 12px 14px; border-radius: 12px; background: #fff8e1;
    color: #8a6100; font-size: 14px;
  }

  /* 목록 */
  .tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); margin: 12px 0 14px; }
  .tabs button {
    background: none; border: 0; padding: 10px 0; font-weight: 700; color: var(--sub); cursor: pointer;
    border-bottom: 2.5px solid transparent; margin-bottom: -1px;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-color: var(--ink); }
  .chips { display: flex; gap: 6px; margin: 10px 0 16px; overflow-x: auto; }
  .chips button {
    border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 14px;
    font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .chips button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .cards { display: grid; gap: 10px; }
  .card { display: flex; gap: 14px; background: var(--card); border-radius: var(--radius); padding: 16px; }
  .card:active { transform: scale(.99); }
  .dday {
    flex: none; width: 58px; height: 58px; border-radius: 14px; background: var(--blue-soft); color: var(--blue);
    display: grid; place-items: center; font-weight: 800; font-size: 15px; text-align: center; line-height: 1.1;
  }
  .dday.urgent { background: #fdecec; color: var(--red); }
  .dday.closed { background: var(--bg); color: var(--sub); }
  .card-body { min-width: 0; flex: 1; }
  .card h3 { margin: 0 0 2px; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card p { margin: 0; color: var(--sub); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; background: var(--bg); color: var(--sub); }
  .tag.blue { background: var(--blue-soft); color: var(--blue); }
  .empty { text-align: center; color: var(--sub); padding: 48px 16px; }
  .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 4px; }
  .fab {
    position: fixed; right: max(16px, calc(50% - 344px)); bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    background: var(--blue); color: #fff; font-weight: 700; border-radius: 999px; padding: 15px 22px;
    box-shadow: 0 6px 20px rgba(26,115,232,.35); z-index: 5;
  }

  /* 설문 참여 */
  .back { display: inline-block; color: var(--sub); font-weight: 600; margin-bottom: 8px; }
  .q { background: var(--card); border-radius: var(--radius); padding: 20px; margin-bottom: 10px; }
  .q-title { font-weight: 700; margin-bottom: 12px; font-size: 17px; }
  .q-title .num { color: var(--blue); margin-right: 6px; }
  .q-title .req { color: var(--red); margin-left: 4px; }
  .opt { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; margin-bottom: 8px; cursor: pointer; }
  .opt input { width: 20px; height: 20px; margin: 0; accent-color: var(--blue); flex: none; }
  .opt:has(input:checked) { border-color: var(--blue); background: var(--blue-soft); }
  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .scale-ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--sub); margin-top: 6px; }
  .notice { background: var(--card); border-radius: var(--radius); padding: 28px 20px; text-align: center; margin-bottom: 12px; }
  .notice b { display: block; font-size: 18px; margin-bottom: 4px; }
  .notice p { margin: 0; color: var(--sub); }

  /* 설문 만들기 */
  .qe { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 10px; border-left: 4px solid var(--blue); }
  .qe-head { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .qe-head strong { margin-right: auto; color: var(--blue); }
  .qe-head select { border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; background: #fff; }
  .icon-btn { border: 0; background: var(--bg); border-radius: 10px; padding: 8px 10px; cursor: pointer; font-size: 14px; color: var(--sub); }
  .opt-edit { display: flex; gap: 6px; margin-bottom: 6px; }
  .opt-edit .input { padding: 10px 12px; }
  .add-opt { background: none; border: 1.5px dashed var(--line); border-radius: 12px; padding: 10px; width: 100%; color: var(--sub); cursor: pointer; font-weight: 600; margin-bottom: 8px; }
  .add-q { width: 100%; border: 2px dashed #c6dafc; background: #fff; color: var(--blue); border-radius: var(--radius); padding: 16px; font-weight: 700; cursor: pointer; margin-bottom: 16px; }

  /* 결과 */
  .big-num { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
  .bar-row { margin-bottom: 10px; }
  .bar-label { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 4px; gap: 8px; }
  .bar-label span:last-child { color: var(--sub); white-space: nowrap; }
  .bar { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
  .answers { max-height: 320px; overflow: auto; display: grid; gap: 6px; }
  .answers div { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; white-space: pre-wrap; word-break: break-word; }

  /* 팝업·알림 */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal-box {
    background: #fff; width: 100%; max-width: 440px; margin: 12px; border-radius: 20px; padding: 24px;
    margin-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); text-align: center;
  }
  @media (min-width: 600px) { .modal { align-items: center; } }
  #qrBox { display: flex; justify-content: center; margin: 16px 0; }
  #qrBox img, #qrBox canvas { max-width: 100%; }
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px));
    background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; z-index: 60;
    max-width: calc(100% - 32px); text-align: center;
  }
  .urow { display: flex; gap: 12px; align-items: center; background: var(--card); border-radius: var(--radius); padding: 14px 16px; }
  .urow-main { flex: 1; min-width: 0; }
  .urow-main a { color: var(--blue); }
  .small { font-size: 13px; color: var(--sub); margin-top: 2px; word-break: break-all; }
  .btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; flex: none; }
  .role-pick { width: 100%; border: 0; text-align: left; cursor: pointer; font: inherit; color: inherit; }
  .role-pick > span { font-size: 22px; color: var(--sub); }
  .loading { text-align: center; color: var(--sub); padding: 40px 0; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="brand" href="#/"><b>GH</b> <span class="brand-text">학교 설문</span></a>
    <button id="installBtn" class="pill blue" hidden>⬇ 바로가기 설치</button>
    <a id="adminBtn" class="pill blue" href="#/admin" hidden>관리</a>
    <a id="meBtn" class="pill" href="#/me" hidden></a>
  </div>
</header>
<main id="app"><div class="loading">불러오는 중…</div></main>
<div id="recaptcha"></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module">
/* =================================================================
   ① 파이어베이스 설정 — README 3단계에서 복사한 값을 붙여넣으세요.
   비워두면 "체험 모드"로 동작해요 (아무 이메일로 로그인, 내 기기에만 저장).
================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyDRr-HP5H00_Y_iB8HyZGooPHrmq5SdS7Q",
  authDomain: "gunwihs-b364e.firebaseapp.com",
  projectId: "gunwihs-b364e",
  storageBucket: "gunwihs-b364e.firebasestorage.app",
  messagingSenderId: "310820765054",
  appId: "1:310820765054:web:8be9e4dc62406bb889c72f"
};

const DEMO = !firebaseConfig.apiKey;
const FB = 'https://www.gstatic.com/firebasejs/10.12.2';
const MAX_CLASS = 12;              // 반 개수 (학교에 맞게 바꾸세요)
const MAX_NUMBER = 40;             // 반별 최대 번호

/* ---------------- 공통 도구 ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const app = $('#app');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastTimer;
function toast(msg, ms = 2500) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), ms);
}
const TEACHER_ONLY = 9;                                         // 대상: 선생님 전용
const gradeLabel = (g) => (g === TEACHER_ONLY ? '선생님 전용' : g ? `${g}학년` : '전체');
const canSeeTeacherOnly = () => S.role === 'teacher' || S.role === 'master';
const genderLabel = (g) => ({ M: '남', F: '여' }[g] || '');
const TYPES = { single: '객관식 (하나 선택)', multi: '체크박스 (여러 개)', short: '단답형', long: '서술형', scale: '점수 (1~5)' };
const hasOptions = (t) => t === 'single' || t === 'multi';
const seatId = (p) => `${p.grade}-${p.classNo}-${p.number}`;   // 예: 2학년 3반 15번 → "2-3-15"

function todayStr() {
  const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
function ddayInfo(deadline) {
  if (!deadline) return { text: '상시', cls: '', closed: false };
  const diff = Math.round((new Date(deadline + 'T00:00:00') - new Date(todayStr() + 'T00:00:00')) / 86400000);
  if (diff < 0) return { text: '마감', cls: 'closed', closed: true };
  if (diff === 0) return { text: 'D-day', cls: 'urgent', closed: false };
  return { text: `D-${diff}`, cls: diff <= 2 ? 'urgent' : '', closed: false };
}

// 카카오톡·인스타그램 같은 앱 안 브라우저에서는 구글이 로그인을 막아요
const UA = navigator.userAgent;
const IS_KAKAO = /KAKAOTALK/i.test(UA);
const IN_APP = IS_KAKAO || /NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp|; wv\)/i.test(UA);

function authError(e) {
  const map = {
    'auth/popup-closed-by-user': '로그인 창이 닫혔어요. 다시 시도해주세요.',
    'auth/cancelled-popup-request': '로그인 창이 닫혔어요. 다시 시도해주세요.',
    'auth/popup-blocked': '팝업이 차단됐어요. 브라우저에서 팝업을 허용해주세요.',
    'auth/network-request-failed': '인터넷 연결을 확인해주세요.',
    'auth/too-many-requests': '요청이 너무 많아요. 잠시 후 다시 시도해주세요.',
    'auth/unauthorized-domain': '이 주소가 파이어베이스 승인 도메인에 없어요. master에게 알려주세요.',
    'auth/operation-not-allowed': '구글 로그인이 꺼져 있어요. master에게 알려주세요.',
    'bad-pin': '비밀번호가 맞지 않아요.',
    'seat-taken': '이미 다른 계정이 등록한 학년·반·번호예요. 번호를 다시 확인하고, 맞다면 master에게 알려주세요.'
  };
  return map[e?.code] || '문제가 생겼어요. 잠시 후 다시 시도해주세요.';
}

/* =================================================================
   ② 데이터 저장소 — 체험 모드(내 기기) / 파이어베이스(실제 서버)
================================================================= */
function demoApi() {
  const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
  const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const DEMO_PINS = { teacher: '1234', master: '123456' };   // 체험 모드 전용 (실제 비밀번호는 Firebase에만 저장)
  let listener = null;
  return {
    onAuth(cb) { listener = cb; cb(load('demo:session', null)); },
    async signIn() {
      const email = prompt('체험 모드예요. 아무 이메일이나 입력하세요.\n(여러 명을 테스트하려면 이메일을 바꿔서 로그인)', 'student1@gmail.com');
      if (!email || !email.trim()) throw { code: 'auth/popup-closed-by-user' };
      const e = email.trim().toLowerCase();
      const u = { uid: 'demo_' + e.replace(/[^a-z0-9]/g, '_'), email: e, name: e.split('@')[0], isAnonymous: false };
      save('demo:session', u); listener?.(u); return u;
    },
    async claimRole(uid, role, name, pin, email) {
      if (pin !== DEMO_PINS[role]) throw { code: 'bad-pin' };
      const roles = load('demo:roles', {}); roles[uid] = { role, name, email, createdAt: Date.now() }; save('demo:roles', roles);
    },
    async getRole(uid) { return load('demo:roles', {})[uid] || null; },
    async logout() { try { localStorage.removeItem('demo:session'); } catch {} listener?.(null); },
    async getProfile(uid) { return load('demo:users', {})[uid] || null; },
    async saveProfile(uid, p) {
      const seats = load('demo:seats', {}), users = load('demo:users', {});
      if (seats[p.seat] && seats[p.seat] !== uid) throw { code: 'seat-taken' };
      const old = users[uid]?.seat;
      if (old && old !== p.seat) delete seats[old];
      seats[p.seat] = uid;
      users[uid] = { createdAt: Date.now(), ...users[uid], ...p, lastLoginAt: Date.now() };
      save('demo:seats', seats); save('demo:users', users);
    },
    async touchLogin(uid) { const u = load('demo:users', {}); if (u[uid]) { u[uid].lastLoginAt = Date.now(); save('demo:users', u); } },
    async listSurveys(all = true) {
      return Object.values(load('demo:surveys', {})).filter((s) => all || !s.staffOnly).sort((a, b) => b.createdAt - a.createdAt);
    },
    async getSurvey(id, all = true) {
      const s = load('demo:surveys', {})[id] || null;
      if (s && s.staffOnly && !all) throw { code: 'permission-denied' };
      return s;
    },
    async createSurvey(d) {
      const all = load('demo:surveys', {}); const id = 's' + Date.now().toString(36);
      all[id] = { ...d, id, createdAt: Date.now() }; save('demo:surveys', all); return id;
    },
    async deleteSurvey(id) {
      const all = load('demo:surveys', {}); delete all[id]; save('demo:surveys', all);
      const r = load('demo:responses', {}); delete r[id]; save('demo:responses', r);
    },
    async getMyResponse(id, uid) { return load('demo:responses', {})[id]?.[uid] || null; },
    async submitResponse(id, uid, d) {
      const r = load('demo:responses', {}); r[id] = r[id] || {};
      if (r[id][uid]) throw new Error('already');
      r[id][uid] = { ...d, createdAt: Date.now() }; save('demo:responses', r);
    },
    async listResponses(id) { return Object.values(load('demo:responses', {})[id] || {}); },
    async countResponses(id) { return Object.keys(load('demo:responses', {})[id] || {}).length; },
    // ----- master -----
    async listUsers() { return Object.entries(load('demo:users', {})).map(([uid, d]) => ({ uid, ...d })); },
    async resetUser(uid, seat) {
      const users = load('demo:users', {}), seats = load('demo:seats', {});
      delete users[uid]; if (seat && seats[seat] === uid) delete seats[seat];
      save('demo:users', users); save('demo:seats', seats);
    },
    async resetAllUsers() { save('demo:users', {}); save('demo:seats', {}); },
    async listRoles() { return Object.entries(load('demo:roles', {})).map(([uid, d]) => ({ uid, ...d })); },
    async removeRole(uid) { const r = load('demo:roles', {}); delete r[uid]; save('demo:roles', r); },
    async setPins() { toast('체험 모드에서는 비밀번호를 바꿀 수 없어요.'); }
  };
}

async function firebaseApi() {
  const [{ initializeApp }, A, F] = await Promise.all([
    import(`${FB}/firebase-app.js`), import(`${FB}/firebase-auth.js`), import(`${FB}/firebase-firestore.js`)
  ]);
  const fbApp = initializeApp(firebaseConfig);
  const auth = A.getAuth(fbApp); auth.languageCode = 'ko';
  const db = F.getFirestore(fbApp);
  const toUser = (u) => (u ? { uid: u.uid, email: u.email, name: u.displayName, isAnonymous: u.isAnonymous } : null);
  const ms = (v) => (v?.toMillis ? v.toMillis() : v || 0);
  const withId = (d) => ({ ...d.data(), id: d.id, createdAt: ms(d.data().createdAt) });
  A.getRedirectResult(auth).catch((e) => toast(authError(e), 4000));
  return {
    onAuth(cb) { A.onAuthStateChanged(auth, (u) => cb(toUser(u))); },
    async signIn() {
      const provider = new A.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      try { return toUser((await A.signInWithPopup(auth, provider)).user); }
      catch (e) {
        if (e.code === 'auth/popup-blocked' || e.code === 'auth/operation-not-supported-in-this-environment') return A.signInWithRedirect(auth, provider);
        throw e;
      }
    },
    // 선생님·master: 비밀번호가 맞을 때만 서버 규칙이 역할 문서를 만들어줌
    async claimRole(uid, role, name, pin, email) {
      try { await F.setDoc(F.doc(db, 'roles', uid), { role, name, pin, email, createdAt: F.serverTimestamp() }); }
      catch (e) { throw { code: e.code === 'permission-denied' ? 'bad-pin' : e.code }; }
    },
    async getRole(uid) { const s = await F.getDoc(F.doc(db, 'roles', uid)); return s.exists() ? s.data() : null; },
    logout: () => A.signOut(auth),
    async getProfile(uid) { const s = await F.getDoc(F.doc(db, 'users', uid)); return s.exists() ? s.data() : null; },
    async saveProfile(uid, p) {
      const seatRef = F.doc(db, 'seats', p.seat), userRef = F.doc(db, 'users', uid);
      const [seatSnap, userSnap] = await Promise.all([F.getDoc(seatRef), F.getDoc(userRef)]);
      if (seatSnap.exists() && seatSnap.data().uid !== uid) throw { code: 'seat-taken' };
      const old = userSnap.exists() ? userSnap.data().seat : null;
      const batch = F.writeBatch(db);
      if (old && old !== p.seat) batch.delete(F.doc(db, 'seats', old));
      if (!seatSnap.exists()) batch.set(seatRef, { uid });
      const extra = userSnap.exists() ? {} : { createdAt: F.serverTimestamp() };
      batch.set(userRef, { ...p, ...extra, updatedAt: F.serverTimestamp(), lastLoginAt: F.serverTimestamp() }, { merge: true });
      try { await batch.commit(); }
      catch (e) { if (e.code === 'permission-denied') throw { code: 'seat-taken' }; throw e; }
    },
    touchLogin: (uid) => F.updateDoc(F.doc(db, 'users', uid), { lastLoginAt: F.serverTimestamp() }),
    async listSurveys(all = true) {
      const col = F.collection(db, 'surveys');
      const q = all ? F.query(col, F.orderBy('createdAt', 'desc'), F.limit(300))
                    : F.query(col, F.where('staffOnly', '==', false), F.limit(300));   // 학생: 선생님 전용 제외
      const s = await F.getDocs(q);
      return s.docs.map(withId).sort((a, b) => b.createdAt - a.createdAt);
    },
    async getSurvey(id) { const s = await F.getDoc(F.doc(db, 'surveys', id)); return s.exists() ? withId(s) : null; },
    async createSurvey(d) { const r = await F.addDoc(F.collection(db, 'surveys'), { ...d, createdAt: F.serverTimestamp() }); return r.id; },
    deleteSurvey: (id) => F.deleteDoc(F.doc(db, 'surveys', id)),
    async getMyResponse(id, uid) { const s = await F.getDoc(F.doc(db, 'surveys', id, 'responses', uid)); return s.exists() ? s.data() : null; },
    submitResponse: (id, uid, d) => F.setDoc(F.doc(db, 'surveys', id, 'responses', uid), { ...d, createdAt: F.serverTimestamp() }),
    async listResponses(id) { const s = await F.getDocs(F.collection(db, 'surveys', id, 'responses')); return s.docs.map((d) => d.data()); },
    async countResponses(id) { const s = await F.getCountFromServer(F.collection(db, 'surveys', id, 'responses')); return s.data().count; },
    // ----- master -----
    async listUsers() {
      const s = await F.getDocs(F.collection(db, 'users'));
      return s.docs.map((d) => { const x = d.data(); return { ...x, uid: d.id, createdAt: ms(x.createdAt), lastLoginAt: ms(x.lastLoginAt) }; });
    },
    async resetUser(uid, seat) {
      const b = F.writeBatch(db);
      b.delete(F.doc(db, 'users', uid));
      if (seat) b.delete(F.doc(db, 'seats', seat));
      await b.commit();
    },
    async resetAllUsers(list) {
      for (let i = 0; i < list.length; i += 200) {
        const b = F.writeBatch(db);
        list.slice(i, i + 200).forEach((u) => { b.delete(F.doc(db, 'users', u.uid)); if (u.seat) b.delete(F.doc(db, 'seats', u.seat)); });
        await b.commit();
      }
    },
    async listRoles() {
      const s = await F.getDocs(F.collection(db, 'roles'));
      return s.docs.map((d) => { const x = d.data(); return { uid: d.id, role: x.role, name: x.name, email: x.email, createdAt: ms(x.createdAt) }; });
    },
    removeRole: (uid) => F.deleteDoc(F.doc(db, 'roles', uid)),
    setPins: (p) => F.setDoc(F.doc(db, 'config', 'secrets'), p)
  };
}

const S = { user: null, profile: null, role: null, staffName: '', adminTab: 'students', filter: { q: '', grade: 0, tab: 'all' } };
let api;
const isStaff = () => S.role === 'teacher' || S.role === 'master';
const isMaster = () => S.role === 'master';
const ready = () => !!S.user && (S.role === 'teacher' || !!S.profile?.number);   // master도 학번 필요
const seatLabel = (seat) => { const [g, c, n] = String(seat || '').split('-'); return n ? `${g}학년 ${c}반 ${n}번` : ''; };
const ownerText = (s) => {
  if (s.ownerRole === 'student') return [seatLabel(s.ownerLabel), s.ownerName].filter(Boolean).join(' ');
  if (s.ownerRole === 'teacher') return `${s.ownerLabel} 선생님`;
  if (s.ownerRole === 'master') return 'master';
  return s.ownerName || '';
};
const fmtTime = (t) => t ? new Date(t).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';

function updateHeader() {
  const me = $('#meBtn'), adm = $('#adminBtn');
  adm.hidden = !isMaster();
  if (!ready()) { me.hidden = true; return; }
  me.hidden = false;
  me.textContent = S.role === 'teacher' ? `${S.staffName} 선생님`
    : S.role === 'master' ? `master · ${S.profile.grade}-${S.profile.classNo} ${S.profile.number}번` : `${S.profile.grade}-${S.profile.classNo} ${S.profile.number}번`;
}

function route() {
  const [a, b, c] = location.hash.replace(/^#\/?/, '').split('/');
  window.scrollTo(0, 0);
  if (a === 'new') return renderBuilder();
  if (a === 'me') return isStaff() ? renderStaffMe() : renderProfile(false);
  if (a === 'profile') return renderProfile(false);
  if (a === 'admin') return isMaster() ? renderAdmin() : renderList();
  if (a === 's' && b && c === 'results') return renderResults(b);
  if (a === 's' && b) return renderSurvey(b);
  renderList();
}

// 로그인하면: 역할(선생님/master) → 학생 정보 → 둘 다 없으면 역할 선택
async function enter(u) {
  S.user = u; S.role = null; S.profile = null; S.staffName = '';
  if (!u) {
    if (/^#\/(me|admin|new)/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search);
    updateHeader(); return renderLogin();
  }
  app.innerHTML = '<div class="loading">불러오는 중…</div>';
  try {
    const r = await api.getRole(u.uid);
    if (r) { S.role = r.role; S.staffName = r.name || ''; }
    if (!r || r.role === 'master') {                       // 학생·master는 학년·반·번호 정보가 있어야 함
      S.profile = await api.getProfile(u.uid);
      if (S.profile?.number) { if (!r) S.role = 'student'; api.touchLogin(u.uid).catch(() => {}); }
    }
  } catch (e) { console.error(e); }
  updateHeader();
  if (!S.role) return renderChooseRole();
  if (S.role === 'master' && !S.profile?.number) return renderProfile(true);
  route();
}

    <input id="q" class="input" type="search" placeholder="설문 제목으로 검색" value="${esc(f.q)}">
    <div class="chips">
      ${[0, 1, 2, 3, ...(canSeeTeacherOnly() ? [TEACHER_ONLY] : [])].map((g) => `<button data-grade="${g}" aria-pressed="${f.grade === g}">${g === TEACHER_ONLY ? '선생님' : g ? g + '학년' : '전체'}</button>`).join('')}
    </div>
    <div id="cards" class="cards"><div class="loading">불러오는 중…</div></div>
    <a class="fab" href="#/new">＋ 설문 만들기</a>`;
  let surveys = [];
  const draw = () => {
    const q = f.q.trim().toLowerCase();
    const list = surveys.filter((s) =>
      (f.tab === 'mine' ? s.ownerUid === S.user.uid : true) &&
      (s.grade !== TEACHER_ONLY || canSeeTeacherOnly()) &&          // 학생에게는 선생님 전용 설문 숨김
      (!f.grade || s.grade === f.grade || (s.grade === 0 && f.grade !== TEACHER_ONLY)) &&
      (!q || s.title.toLowerCase().includes(q)));
    $('#cards').innerHTML = list.length ? list.map(cardHtml).join('') :
      `<div class="empty"><b>${f.tab === 'mine' ? '아직 만든 설문이 없어요' : '설문이 없어요'}</b>
       ${f.tab === 'mine' ? '아래 버튼으로 첫 설문을 만들어보세요.' : '다른 검색어나 학년을 선택해보세요.'}</div>`;
  };
  app.querySelector('.tabs').onclick = (e) => {
    const t = e.target.closest('[data-tab]'); if (!t) return;
    f.tab = t.dataset.tab;
    app.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', b === t));
    draw();
  };
  app.querySelector('.chips').onclick = (e) => {
    const b = e.target.closest('[data-grade]'); if (!b) return;
    f.grade = Number(b.dataset.grade);
    app.querySelectorAll('.chips button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    draw();
  };
  $('#q').oninput = (e) => { f.q = e.target.value; draw(); };
  try { surveys = await api.listSurveys(canSeeTeacherOnly()); draw(); }
  catch (e) { console.error(e); $('#cards').innerHTML = `<div class="empty"><b>목록을 불러오지 못했어요</b>인터넷 연결을 확인하고 새로고침해주세요.</div>`; }
}
function cardHtml(s) {
  const d = ddayInfo(s.deadline);
  return `<a class="card" href="#/s/${esc(s.id)}">
    <div class="dday ${d.cls}">${d.text}</div>
    <div class="card-body">
      <h3>${esc(s.title)}</h3>
      ${s.desc ? `<p>${esc(s.desc)}</p>` : ''}
      <div class="meta">
        <span class="tag blue">${gradeLabel(s.grade)}</span>
        <span class="tag">질문 ${s.questions.length}개</span>
        ${ownerText(s) ? `<span class="tag">${esc(ownerText(s))}</span>` : ''}
        ${s.ownerUid === S.user.uid ? '<span class="tag">내 설문</span>' : ''}
      </div>
    </div></a>`;
}

/* ---------- 설문 참여 ---------- */
async function renderSurvey(id) {
  app.innerHTML = '<div class="loading">불러오는 중…</div>';
  let s, mine;
  try { [s, mine] = await Promise.all([api.getSurvey(id, canSeeTeacherOnly()), api.getMyResponse(id, S.user.uid)]); }
  catch (e) {
    console.error(e);
    app.innerHTML = e?.code === 'permission-denied'
      ? '<div class="empty"><b>삭제되었거나 없는 설문이에요</b><a href="#/">목록으로 돌아가기</a></div>'
      : '<div class="empty"><b>설문을 불러오지 못했어요</b><a href="#/">목록으로 돌아가기</a></div>';
    return;
  }
  if (!s) { app.innerHTML = '<div class="empty"><b>삭제되었거나 없는 설문이에요</b><a href="#/">목록으로 돌아가기</a></div>'; return; }

  const d = ddayInfo(s.deadline);
  const isOwner = s.ownerUid === S.user.uid;
  const canResults = isOwner || isStaff();
  const canDelete = isOwner || isMaster();
  const isTeacher = S.role === 'teacher';
  let blocked = '';
  if (s.grade === TEACHER_ONLY && !isTeacher) blocked = `<b>선생님 전용 설문이에요</b><p>선생님만 응답할 수 있어요.</p>`;
  else if (s.grade >= 1 && s.grade <= 3 && isTeacher) blocked = `<b>${s.grade}학년 학생 대상 설문이에요</b><p>결과 보기에서 응답을 확인하세요.</p>`;
  else if (s.grade >= 1 && s.grade <= 3 && s.grade !== S.profile?.grade) blocked = `<b>${s.grade}학년 대상 설문이에요</b><p>내 정보의 학년이 다르면 참여할 수 없어요.</p>`;
  let body;
  if (mine) body = `<div class="notice"><b>참여를 완료했어요 ✓</b><p>응답은 한 번만 할 수 있어요.</p></div>`;
  else if (d.closed) body = `<div class="notice"><b>마감된 설문이에요</b><p>${esc(s.deadline)}에 마감되었어요.</p></div>`;
  else if (blocked) body = `<div class="notice">${blocked}</div>`;
  else body = `<form id="answerForm" novalidate>${s.questions.map(questionHtml).join('')}
      <button class="btn primary full" type="submit">제출하기</button></form>`;

  app.innerHTML = `
    <a class="back" href="#/">← 목록으로</a>
    <div class="box">
      <div class="meta" style="margin:0 0 8px">
        <span class="tag blue">${gradeLabel(s.grade)}</span>
        <span class="tag">${s.deadline ? '마감 ' + esc(s.deadline) + ' (' + d.text + ')' : '마감일 없음'}</span>
        ${ownerText(s) ? `<span class="tag">작성 ${esc(ownerText(s))}</span>` : ''}
      </div>
      <h1 style="margin-top:0">${esc(s.title)}</h1>
      ${s.desc ? `<p class="sub" style="margin:0;white-space:pre-wrap">${esc(s.desc)}</p>` : ''}
      <div class="row" style="margin-top:16px">
        ${canResults ? `<a class="btn soft" href="#/s/${esc(id)}/results">결과 보기</a>` : ''}
        <button class="btn soft" id="qrBtn">QR 코드</button>
        ${canDelete ? '<button class="btn danger" id="delBtn">삭제</button>' : ''}
      </div>
    </div>
    ${body}`;

  $('#qrBtn').onclick = () => showQR(s);
  if (canDelete) $('#delBtn').onclick = async () => {
    if (!confirm('이 설문을 삭제할까요? 삭제하면 되돌릴 수 없어요.')) return;
    try { await api.deleteSurvey(id); toast('삭제했어요.'); location.hash = '#/'; }
    catch (e) { console.error(e); toast('삭제하지 못했어요.'); }
  };

  const form = $('#answerForm');
  if (!form) return;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const answers = [];
    for (const [i, q] of s.questions.entries()) {
      const name = 'q' + i;
      let v;
      if (q.type === 'multi') v = [...form.querySelectorAll(`input[name=${name}]:checked`)].map((x) => x.value);
      else if (q.type === 'single') v = form.querySelector(`input[name=${name}]:checked`)?.value ?? '';
      else if (q.type === 'scale') v = Number(form.querySelector(`input[name=${name}]:checked`)?.value || 0);
      else v = form.querySelector(`[name=${name}]`).value.trim();
      const empty = Array.isArray(v) ? !v.length : !v;
      if (q.required && empty) {
        toast(`${i + 1}번 질문에 답해주세요.`);
        form.querySelectorAll('.q')[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      answers.push(v);
    }
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try {
      await api.submitResponse(id, S.user.uid, isTeacher
        ? { answers, role: 'teacher', name: S.staffName, grade: 0, classNo: 0, gender: '' }
        : { answers, role: 'student', grade: S.profile.grade, classNo: S.profile.classNo, gender: S.profile.gender });
      toast('제출했어요. 참여해줘서 고마워요!');
      renderSurvey(id);
    } catch (err) { console.error(err); toast('제출하지 못했어요. 이미 참여했는지 확인해주세요.'); btn.disabled = false; }
  };
}
function questionHtml(q, i) {
  const name = 'q' + i;
  let input;
  if (q.type === 'single' || q.type === 'multi') {
    const t = q.type === 'single' ? 'radio' : 'checkbox';
    input = q.options.map((o) => `<label class="opt"><input type="${t}" name="${name}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('');
  } else if (q.type === 'scale') {
    input = `<div class="seg scale">${[1, 2, 3, 4, 5].map((n) => `<label><input type="radio" name="${name}" value="${n}"><span>${n}</span></label>`).join('')}</div>
      <div class="scale-ends"><span>전혀 아니다</span><span>매우 그렇다</span></div>`;
  } else if (q.type === 'short') input = `<input class="input" name="${name}" maxlength="100" placeholder="답변을 입력하세요">`;
  else input = `<textarea class="input" name="${name}" maxlength="1000" placeholder="답변을 입력하세요"></textarea>`;
  return `<div class="q"><div class="q-title"><span class="num">${i + 1}</span>${esc(q.title)}${q.required ? '<span class="req">*</span>' : ''}
    ${q.type === 'multi' ? '<span class="tag" style="margin-left:6px">여러 개 선택</span>' : ''}</div>${input}</div>`;
}

/* ---------- 설문 만들기 ---------- */
function renderBuilder() {
  const draft = { title: '', desc: '', grade: 0, deadline: '', questions: [newQuestion()] };
  app.innerHTML = `
    <a class="back" href="#/">← 목록으로</a>
    <h1>새 설문 만들기</h1>
    <p class="sub">질문을 추가하고 선택지를 적으면 바로 설문이 만들어져요.</p>
    <div class="box">
      ${S.profile?.seat ? `<label class="field"><span>작성자 이름</span><input id="bName" maxlength="20" autocomplete="name" placeholder="예: 서은수" value="${esc((() => { try { return localStorage.getItem('ownerName') || ''; } catch { return ''; } })())}">
        <small class="small">설문 목록에 "${esc(seatLabel(S.profile.seat))} 이름"으로 표시돼요.</small></label>` : ''}
      <label class="field"><span>설문 제목</span><input id="bTitle" maxlength="100" placeholder="예: 체육대회 종목 투표"></label>
      <label class="field"><span>설명 (선택)</span><textarea id="bDesc" maxlength="500" placeholder="설문 목적이나 안내를 적어주세요"></textarea></label>
      <div class="field"><span>대상 학년</span><div class="seg">
        ${[0, 1, 2, 3, ...(canSeeTeacherOnly() ? [TEACHER_ONLY] : [])].map((g) => `<label><input type="radio" name="bGrade" value="${g}" ${g === 0 ? 'checked' : ''}><span>${g === TEACHER_ONLY ? '선생님 전용' : g ? g + '학년' : '전체'}</span></label>`).join('')}
      </div></div>
      <label class="field" style="margin:0"><span>마감일 (선택)</span><input id="bDeadline" type="date" min="${todayStr()}"></label>
    </div>
    <div id="qList"></div>
    <button class="add-q" id="addQ">＋ 질문 추가</button>
    <button class="btn primary full" id="publish">설문 올리기</button>`;

  const qList = $('#qList');
  const drawQs = () => {
    qList.innerHTML = draft.questions.map((q, i) => `
      <div class="qe" data-i="${i}">
        <div class="qe-head">
          <strong>질문 ${i + 1}</strong>
          <select data-act="type" aria-label="질문 유형">${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${q.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <button class="icon-btn" data-act="delq" aria-label="질문 삭제">삭제</button>
        </div>
        <input class="input" data-f="title" maxlength="200" placeholder="질문을 입력하세요" value="${esc(q.title)}" style="margin-bottom:10px">
        ${hasOptions(q.type) ? q.options.map((o, j) => `
          <div class="opt-edit">
            <input class="input" data-o="${j}" maxlength="100" placeholder="선택지 ${j + 1}" value="${esc(o)}">
            <button class="icon-btn" data-act="delopt" data-o="${j}" aria-label="선택지 삭제">✕</button>
          </div>`).join('') + '<button class="add-opt" data-act="addopt">＋ 선택지 추가</button>' : ''}
        ${q.type === 'scale' ? '<p class="sub" style="margin:0 0 8px">1점(전혀 아니다) ~ 5점(매우 그렇다)으로 답해요.</p>' : ''}
        <label class="check" style="margin:4px 0 0"><input type="checkbox" data-f="required" ${q.required ? 'checked' : ''}> 필수 응답</label>
      </div>`).join('');
  };
  drawQs();

  // 글자 입력: 화면을 다시 그리지 않고 값만 저장 (입력 중 커서 유지)
  qList.addEventListener('input', (e) => {
    const box = e.target.closest('.qe'); if (!box) return;
    const q = draft.questions[box.dataset.i];
    if (e.target.dataset.f === 'title') q.title = e.target.value;
    if (e.target.dataset.o !== undefined && e.target.tagName === 'INPUT') q.options[e.target.dataset.o] = e.target.value;
  });
  qList.addEventListener('change', (e) => {
    const box = e.target.closest('.qe'); if (!box) return;
    const q = draft.questions[box.dataset.i];
    if (e.target.dataset.f === 'required') q.required = e.target.checked;
    if (e.target.dataset.act === 'type') {
      q.type = e.target.value;
      if (hasOptions(q.type) && q.options.length < 2) q.options = ['', ''];
      drawQs();
    }
  });
  qList.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-act]'); if (!btn) return;
    const i = Number(btn.closest('.qe').dataset.i); const q = draft.questions[i];
    if (btn.dataset.act === 'delq') {
      if (draft.questions.length === 1) return toast('질문은 최소 1개 있어야 해요.');
      draft.questions.splice(i, 1);
    }
    if (btn.dataset.act === 'addopt') { if (q.options.length >= 20) return toast('선택지는 20개까지 만들 수 있어요.'); q.options.push(''); }
    if (btn.dataset.act === 'delopt') {
      if (q.options.length <= 2) return toast('선택지는 최소 2개 있어야 해요.');
      q.options.splice(Number(btn.dataset.o), 1);
    }
    drawQs();
  });
  $('#addQ').onclick = () => {
    if (draft.questions.length >= 30) return toast('질문은 30개까지 만들 수 있어요.');
    draft.questions.push(newQuestion()); drawQs();
    qList.lastElementChild.querySelector('[data-f=title]').focus();
  };

  $('#publish').onclick = async () => {
    draft.title = $('#bTitle').value.trim();
    draft.desc = $('#bDesc').value.trim();
    draft.grade = Number(document.querySelector('input[name=bGrade]:checked').value);
    draft.deadline = $('#bDeadline').value;
    const asStudent = !!S.profile?.seat && S.role !== 'teacher';
    const ownerName = asStudent ? $('#bName').value.trim() : '';
    if (asStudent && !ownerName) { $('#bName').focus(); return toast('작성자 이름을 입력해주세요.'); }
    if (!draft.title) { $('#bTitle').focus(); return toast('설문 제목을 입력해주세요.'); }
    for (const [i, q] of draft.questions.entries()) {
      if (!q.title.trim()) return toast(`${i + 1}번 질문 내용을 입력해주세요.`);
      if (hasOptions(q.type) && q.options.filter((o) => o.trim()).length < 2) return toast(`${i + 1}번 질문에 선택지를 2개 이상 적어주세요.`);
    }
    const questions = draft.questions.map((q) => ({
      type: q.type, title: q.title.trim(), required: q.required,
      options: hasOptions(q.type) ? [...new Set(q.options.map((o) => o.trim()).filter(Boolean))] : []
    }));
    const btn = $('#publish'); btn.disabled = true; btn.textContent = '올리는 중…';
    try {
      const id = await api.createSurvey({
        title: draft.title, desc: draft.desc, grade: draft.grade, deadline: draft.deadline,
        questions, ownerUid: S.user.uid, staffOnly: draft.grade === TEACHER_ONLY,
        ...(asStudent ? { ownerRole: 'student', ownerLabel: S.profile.seat, ownerName } : { ownerRole: S.role, ownerLabel: S.staffName })
      });
      if (ownerName) { try { localStorage.setItem('ownerName', ownerName); } catch {} }
      toast('설문을 올렸어요!');
      location.hash = '#/s/' + id;
    } catch (e) { console.error(e); toast('올리지 못했어요. 다시 시도해주세요.'); btn.disabled = false; btn.textContent = '설문 올리기'; }
  };
}
const newQuestion = () => ({ type: 'single', title: '', options: ['', ''], required: true });

/* ---------- 결과 보기 (만든 사람·선생님·master) ---------- */
async function renderResults(id) {
  app.innerHTML = '<div class="loading">결과를 모으는 중…</div>';
  let s, all;
  try {
    s = await api.getSurvey(id, canSeeTeacherOnly());
    if (!s || (s.ownerUid !== S.user.uid && !isStaff())) { app.innerHTML = '<div class="empty"><b>설문을 만든 사람과 선생님만 결과를 볼 수 있어요</b><a href="#/">목록으로 돌아가기</a></div>'; return; }
    all = await api.listResponses(id);
  } catch (e) { console.error(e); app.innerHTML = '<div class="empty"><b>결과를 불러오지 못했어요</b><a href="#/">목록으로 돌아가기</a></div>'; return; }

  const f = { grade: 0, gender: '' };
  app.innerHTML = `
    <a class="back" href="#/s/${esc(id)}">← 설문으로</a>
    <h1>${esc(s.title)}</h1>
    <p class="sub">응답 결과</p>
    <div class="chips" id="gradeF">${[0, 1, 2, 3, TEACHER_ONLY].map((g) => `<button data-v="${g}" aria-pressed="${g === 0}">${g === TEACHER_ONLY ? '선생님' : g ? g + '학년' : '전체'}</button>`).join('')}</div>
    <div class="chips" id="genderF" style="margin-top:-8px">${[['', '전체 성별'], ['M', '남'], ['F', '여']].map(([v, l]) => `<button data-v="${v}" aria-pressed="${v === ''}">${l}</button>`).join('')}</div>
    <div id="res"></div>
    <button class="btn soft full" id="csvBtn">엑셀(CSV)로 내려받기</button>`;

  const draw = () => {
    const isT = (r) => r.role === 'teacher';
    const rs = all.filter((r) => (!f.grade || (f.grade === TEACHER_ONLY ? isT(r) : r.grade === f.grade)) && (!f.gender || r.gender === f.gender));
    const n = rs.length;
    let html = `<div class="box"><div class="big-num">${n}명</div><p class="sub" style="margin:6px 0 0">
      ${[1, 2, 3].map((g) => `${g}학년 ${rs.filter((r) => !isT(r) && r.grade === g).length}명`).join(', ')}, 선생님 ${rs.filter(isT).length}명</p></div>`;
    s.questions.forEach((q, i) => {
      const vals = rs.map((r) => r.answers?.[i]);
      html += `<div class="q"><div class="q-title"><span class="num">${i + 1}</span>${esc(q.title)}</div>`;
      if (hasOptions(q.type) || q.type === 'scale') {
        const opts = q.type === 'scale' ? ['1', '2', '3', '4', '5'] : q.options;
        const count = (o) => vals.filter((v) => (Array.isArray(v) ? v.includes(o) : String(v) === o)).length;
        html += opts.map((o) => {
          const c = count(o), pct = n ? Math.round((c / n) * 100) : 0;
          return `<div class="bar-row"><div class="bar-label"><span>${q.type === 'scale' ? o + '점' : esc(o)}</span><span>${c}명 (${pct}%)</span></div>
            <div class="bar"><i style="width:${pct}%"></i></div></div>`;
        }).join('');
        if (q.type === 'scale') {
          const nums = vals.filter((v) => v > 0);
          html += `<p class="sub" style="margin:8px 0 0">평균 ${nums.length ? (nums.reduce((a, b) => a + b, 0) / nums.length).toFixed(1) : '-'}점</p>`;
        }
      } else {
        const texts = vals.filter(Boolean);
        html += texts.length ? `<div class="answers">${texts.map((t) => `<div>${esc(t)}</div>`).join('')}</div>` : '<p class="sub" style="margin:0">아직 답변이 없어요.</p>';
      }
      html += '</div>';
    });
    $('#res').innerHTML = html;
  };
  const bindChips = (el, key, num) => (el.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    f[key] = num ? Number(b.dataset.v) : b.dataset.v;
    el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    draw();
  });
  bindChips($('#gradeF'), 'grade', true);
  bindChips($('#genderF'), 'gender', false);
  draw();

  $('#csvBtn').onclick = () => {
    const cell = (v) => `"${String(Array.isArray(v) ? v.join(', ') : v ?? '').replace(/"/g, '""')}"`;
    const head = ['구분', '학년', '반', '성별', ...s.questions.map((q) => q.title)].map(cell).join(',');
    const rows = all.map((r) => [r.role === 'teacher' ? `선생님(${r.name || ''})` : '학생', r.role === 'teacher' ? '' : r.grade, r.role === 'teacher' ? '' : r.classNo,
      genderLabel(r.gender), ...s.questions.map((_, i) => r.answers?.[i])].map(cell).join(','));
    const blob = new Blob(['\uFEFF' + [head, ...rows].join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `${s.title}_결과.csv`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };
}

/* ---------- master(마스터) 화면 ---------- */
async function renderAdmin() {
  const tab = S.adminTab;
  app.innerHTML = `
    <h1>master 관리</h1>
    <div class="tabs" role="tablist">
      ${[['students', '학생'], ['surveys', '설문'], ['teachers', '선생님'], ['settings', '비밀번호']].map(([k, l]) =>
        `<button role="tab" data-a="${k}" aria-selected="${tab === k}">${l}</button>`).join('')}
    </div>
    <div id="adminBody"><div class="loading">불러오는 중…</div></div>`;
  app.querySelector('.tabs').onclick = (e) => { const b = e.target.closest('[data-a]'); if (!b) return; S.adminTab = b.dataset.a; renderAdmin(); };
  const body = $('#adminBody');
  try {
    if (tab === 'students') await adminStudents(body);
    else if (tab === 'surveys') await adminSurveys(body);
    else if (tab === 'teachers') await adminTeachers(body);
    else adminSettings(body);
  } catch (e) {
    console.error(e);
    body.innerHTML = '<div class="empty"><b>불러오지 못했어요</b>Firebase 보안 규칙이 최신 버전인지 확인해주세요.</div>';
  }
}

async function adminStudents(body) {
  const [users, surveys] = await Promise.all([api.listUsers(), api.listSurveys()]);
  const made = {};
  surveys.forEach((s) => { (made[s.ownerUid] = made[s.ownerUid] || []).push(s); });
  const f = { grade: 0, q: '', sort: 'seat' };
  body.innerHTML = `
    <div class="box" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <div style="margin-right:auto"><div class="big-num">${users.length}명</div><p class="sub" style="margin:4px 0 0">등록한 학생</p></div>
      <button class="btn danger" id="resetAll">전체 초기화</button>
    </div>
    <input id="uq" class="input" type="search" placeholder="번호(예: 2-3-15)나 이메일로 검색">
    <div class="chips" id="ug">${[0, 1, 2, 3].map((g) => `<button data-v="${g}" aria-pressed="${g === 0}">${g ? g + '학년' : '전체'}</button>`).join('')}</div>
    <div class="chips" id="us" style="margin-top:-8px">
      <button data-v="seat" aria-pressed="true">번호순</button><button data-v="login" aria-pressed="false">최근 접속순</button>
    </div>
    <div id="ulist" class="cards"></div>`;
  const draw = () => {
    const q = f.q.trim().toLowerCase();
    let list = users.filter((u) => (!f.grade || u.grade === f.grade) &&
      (!q || String(u.seat).includes(q) || String(u.email || '').toLowerCase().includes(q)));
    list.sort(f.sort === 'login' ? (a, b) => (b.lastLoginAt || 0) - (a.lastLoginAt || 0)
      : (a, b) => a.grade - b.grade || a.classNo - b.classNo || a.number - b.number);
    $('#ulist').innerHTML = list.length ? list.map((u) => {
      const mine = made[u.uid] || [];
      return `<div class="urow">
        <div class="urow-main">
          <b>${u.grade}학년 ${u.classNo}반 ${u.number}번</b> <span class="tag">${genderLabel(u.gender)}</span>
          <div class="small">${esc(u.email || '')}</div>
          <div class="small">가입 ${fmtTime(u.createdAt)} · 마지막 접속 ${fmtTime(u.lastLoginAt)}</div>
          ${mine.length ? `<div class="small">올린 설문 ${mine.length}개: ${mine.map((s) => `<a href="#/s/${esc(s.id)}">${esc(s.title)}</a>`).join(', ')}</div>` : ''}
        </div>
        <button class="btn danger sm" data-reset="${esc(u.uid)}">초기화</button>
      </div>`;
    }).join('') : '<div class="empty"><b>학생이 없어요</b></div>';
  };
  const chips = (el, key, num) => (el.onclick = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    f[key] = num ? Number(b.dataset.v) : b.dataset.v;
    el.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b)); draw();
  });
  chips($('#ug'), 'grade', true); chips($('#us'), 'sort', false);
  $('#uq').oninput = (e) => { f.q = e.target.value; draw(); };
  $('#ulist').onclick = async (e) => {
    const b = e.target.closest('[data-reset]'); if (!b) return;
    const u = users.find((x) => x.uid === b.dataset.reset);
    if (!confirm(`${u.grade}학년 ${u.classNo}반 ${u.number}번 학생의 등록을 초기화할까요?\n다음에 로그인하면 학년·반·번호를 다시 입력하게 돼요.`)) return;
    b.disabled = true;
    try { await api.resetUser(u.uid, u.seat); toast('초기화했어요.'); renderAdmin(); }
    catch (err) { console.error(err); toast('초기화하지 못했어요.'); b.disabled = false; }
  };
  $('#resetAll').onclick = async () => {
    if (!users.length) return toast('초기화할 학생이 없어요.');
    const t = prompt(`학생 ${users.length}명의 등록을 모두 초기화해요.\n되돌릴 수 없어요. 계속하려면 "초기화"라고 입력하세요.`);
    if (t !== '초기화') return;
    try { await api.resetAllUsers(users); toast('전체 초기화했어요.'); renderAdmin(); }
    catch (err) { console.error(err); toast('초기화하지 못했어요.'); }
  };
  draw();
}

async function adminSurveys(body) {
  const surveys = await api.listSurveys();
  body.innerHTML = `<p class="sub">전체 설문 ${surveys.length}개 · 모든 설문의 결과를 보고 삭제할 수 있어요.</p>
    <div class="cards">${surveys.map((s) => `
      <div class="urow">
        <div class="urow-main">
          <b><a href="#/s/${esc(s.id)}">${esc(s.title)}</a></b>
          <div class="small">작성 ${esc(ownerText(s) || '알 수 없음')} · ${fmtTime(s.createdAt)} · ${gradeLabel(s.grade)} · ${ddayInfo(s.deadline).text}</div>
          <div class="small">응답 <span data-count="${esc(s.id)}">…</span>명</div>
        </div>
        <div class="row" style="flex:none">
          <a class="btn soft sm" href="#/s/${esc(s.id)}/results">결과</a>
          <button class="btn danger sm" data-del="${esc(s.id)}">삭제</button>
        </div>
      </div>`).join('') || '<div class="empty"><b>설문이 없어요</b></div>'}</div>`;
  surveys.forEach(async (s) => {
    try { const n = await api.countResponses(s.id); const el = body.querySelector(`[data-count="${CSS.escape(s.id)}"]`); if (el) el.textContent = n; }
    catch (e) { console.error(e); }
  });
  body.onclick = async (e) => {
    const b = e.target.closest('[data-del]'); if (!b) return;
    const s = surveys.find((x) => x.id === b.dataset.del);
    if (!confirm(`"${s.title}" 설문을 삭제할까요? 되돌릴 수 없어요.`)) return;
    try { await api.deleteSurvey(s.id); toast('삭제했어요.'); renderAdmin(); }
    catch (err) { console.error(err); toast('삭제하지 못했어요.'); }
  };
}

async function adminTeachers(body) {
  const roles = (await api.listRoles()).filter((r) => r.role === 'teacher').sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  body.innerHTML = `<p class="sub">선생님으로 등록한 구글 계정이에요. 권한을 해제하면 다음 로그인 때 역할을 다시 골라야 해요.</p>
    <div class="cards">${roles.map((r) => `
      <div class="urow">
        <div class="urow-main"><b>${esc(r.name)} 선생님</b><div class="small">${esc(r.email || '')}</div><div class="small">등록 ${fmtTime(r.createdAt)}</div></div>
        <button class="btn danger sm" data-rm="${esc(r.uid)}">권한 해제</button>
      </div>`).join('') || '<div class="empty"><b>로그인한 선생님이 없어요</b></div>'}</div>`;
  body.onclick = async (e) => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    if (!confirm('이 선생님 로그인의 권한을 해제할까요?')) return;
    try { await api.removeRole(b.dataset.rm); toast('해제했어요.'); renderAdmin(); }
    catch (err) { console.error(err); toast('해제하지 못했어요.'); }
  };
}

function adminSettings(body) {
  body.innerHTML = `<div class="box">
    <p class="sub" style="margin-top:0">비밀번호는 Firebase 서버에만 저장되고 사이트 코드에는 들어가지 않아요. 두 칸 모두 입력해야 저장돼요.</p>
    <label class="field"><span>새 선생님 비밀번호 (4자 이상)</span><input id="tp" type="password" autocomplete="new-password"></label>
    <label class="field"><span>새 master 비밀번호 (4자 이상)</span><input id="mp" type="password" autocomplete="new-password"></label>
    <button class="btn primary full" id="pinSave">저장하기</button></div>`;
  $('#pinSave').onclick = async () => {
    const teacherPin = $('#tp').value.trim(), masterPin = $('#mp').value.trim();
    if (teacherPin.length < 4 || masterPin.length < 4) return toast('두 비밀번호 모두 4자 이상 입력해주세요.');
    if (teacherPin === masterPin) return toast('선생님과 master 비밀번호는 달라야 해요.');
    try { await api.setPins({ teacherPin, masterPin }); toast('비밀번호를 바꿨어요.'); $('#tp').value = ''; $('#mp').value = ''; }
    catch (e) { console.error(e); toast('저장하지 못했어요.'); }
  };
}

/* ---------- QR 코드 ---------- */
function showQR(s) {
  const url = location.origin + location.pathname + '#/s/' + s.id;
  const m = $('#modal');
  m.innerHTML = `<div class="modal-box" role="dialog" aria-label="설문 QR 코드">
    <h2>${esc(s.title)}</h2>
    <p class="sub" style="margin:0">스마트폰으로 찍으면 설문으로 바로 이동해요.</p>
    <div id="qrBox"></div>
    <div class="row"><button class="btn soft" id="qrSave">QR 저장</button><button class="btn soft" id="qrCopy">링크 복사</button></div>
    <button class="btn ghost full" id="qrClose" style="margin-top:6px">닫기</button></div>`;
  m.hidden = false;
  if (window.QRCode) new QRCode($('#qrBox'), { text: url, width: 220, height: 220 });
  else $('#qrBox').innerHTML = '<p class="sub">QR 코드를 불러오지 못했어요. 링크 복사를 이용해주세요.</p>';
  $('#qrClose').onclick = () => (m.hidden = true);
  m.onclick = (e) => { if (e.target === m) m.hidden = true; };
  $('#qrSave').onclick = () => {
    const c = $('#qrBox canvas'); if (!c) return;
    const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = `${s.title}_QR.png`; a.click();
  };
  $('#qrCopy').onclick = async () => {
    try { await navigator.clipboard.writeText(url); toast('링크를 복사했어요.'); }
    catch { prompt('아래 링크를 복사하세요', url); }
  };
}

/* =================================================================
   ④ 앱 설치 버튼 + 시작
================================================================= */
(function installSetup() {
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./service-worker.js').catch(() => {});
  const btn = $('#installBtn');
  const ua = navigator.userAgent;
  const isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(ua);
  const isEdge = /Edg\//.test(ua);
  const installed = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let ev = null;
  if (installed) return;                  // 이미 앱으로 실행 중이면 버튼 숨김
  btn.hidden = false;                     // 학교 사이트처럼 항상 보이게
  addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault(); ev = e;
    const gi = document.getElementById('guideInstall');   // 안내창이 열려 있으면 바로 설치 버튼으로 바꿔줌
    if (gi) gi.hidden = false;
  });
  addEventListener('appinstalled', () => { btn.hidden = true; toast('설치했어요! 바탕화면이나 홈 화면에서 열 수 있어요.', 4000); });

  function guide() {
    let title, steps;
    if (IN_APP) {
      title = '다른 브라우저로 열어주세요';
      steps = ['카카오톡·인스타그램 안에서는 설치가 안 돼요.', '오른쪽 위 메뉴(⋮ 또는 …)에서 <b>다른 브라우저로 열기</b>를 누른 뒤 다시 설치해주세요.'];
    } else if (isIOS) {
      title = '아이폰에 설치하기';
      steps = ['<b>사파리</b>로 이 사이트를 열어주세요.', '아래쪽 <b>공유 버튼(□↑)</b>을 누르세요.', '<b>홈 화면에 추가</b>를 누르세요.'];
    } else if (isAndroid) {
      title = '안드로이드에 설치하기';
      steps = ['오른쪽 위 <b>⋮ 메뉴</b>를 누르세요. (삼성 인터넷은 아래쪽 <b>≡ 메뉴</b>)', '<b>앱 설치</b> 또는 <b>홈 화면에 추가</b>를 누르세요.', '크롬은 사이트를 처음 열면 잠깐(약 30초) 둘러봐야 바로 설치 창을 띄워줘요. 조금 뒤에 다시 눌러봐도 돼요.'];
    } else if (isEdge) {
      title = 'PC에 설치하기 (엣지)';
      steps = ['주소창 오른쪽의 <b>앱 설치 아이콘(⊞)</b>을 누르세요.', '안 보이면 오른쪽 위 <b>…</b> → <b>앱</b> → <b>이 사이트를 앱으로 설치</b>를 누르세요.'];
    } else {
      title = 'PC에 설치하기 (크롬)';
      steps = ['주소창 오른쪽의 <b>설치 아이콘(모니터에 ↓)</b>을 누르세요.', '안 보이면 오른쪽 위 <b>⋮</b> → <b>전송, 저장, 공유</b> → <b>페이지를 앱으로 설치</b>를 누르세요.', '시크릿 창에서는 설치가 안 돼요.'];
    }
    const m = $('#modal');
    m.innerHTML = `<div class="modal-box" role="dialog" aria-label="${title}" style="text-align:left">
      <h2>${title}</h2>
      <ol style="padding-left:20px;line-height:1.8;margin:12px 0 16px">${steps.map((s) => `<li>${s}</li>`).join('')}</ol>
      <button class="btn primary full" id="guideInstall" hidden style="margin-bottom:8px">지금 바로 설치</button>
      <button class="btn soft full" id="guideOk">확인</button></div>`;
    m.hidden = false;
    $('#guideOk').onclick = () => (m.hidden = true);
    $('#guideInstall').onclick = () => { m.hidden = true; install(); };
    m.onclick = (e) => { if (e.target === m) m.hidden = true; };
  }

  async function install() {
    const e = ev; ev = null;
    e.prompt();
    const { outcome } = await e.userChoice;
    if (outcome === 'accepted') btn.hidden = true;
  }
  btn.onclick = async () => {
    if (!ev && !isIOS && !IN_APP) {         // 브라우저가 아직 준비 중이면 잠깐 기다려봄
      btn.disabled = true;
      for (let i = 0; i < 15 && !ev; i++) await new Promise((r) => setTimeout(r, 100));
      btn.disabled = false;
    }
    if (ev) return install();              // 크롬·엣지·안드로이드: 바로 설치 창
    guide();                               // 그 외: 설치 방법 안내
  };
})();

(async function start() {
  try { api = DEMO ? demoApi() : await firebaseApi(); }
  catch (e) { console.error(e); app.innerHTML = '<div class="empty"><b>서버에 연결하지 못했어요</b>인터넷 연결을 확인하고 새로고침해주세요.</div>'; return; }
  api.onAuth((u) => enter(u));
  addEventListener('hashchange', () => { if (ready()) route(); });
})();
